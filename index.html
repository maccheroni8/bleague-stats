<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B.LEAGUE Stats</title>
    <!-- 画像を差し替えるときは v も更新し、ブラウザのアイコンキャッシュを更新する。 -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%bleague-stats-favicon.ico?v=mono-20261022" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%bleague-stats-favicon.png?v=mono-20261022" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%bleague-stats-apple-touch-icon.png?v=mono-20261022" />
    <script>
      // src/lib/theme.tsと同じキー("bleague-stats-theme")。CSS適用前に同期実行して
      // data-theme属性を確定させ、手動選択済みテーマとOS設定が異なる場合の
      // 一瞬の描画切り替わり(FOUC)を防ぐ
      (function () {
        try {
          var stored = localStorage.getItem("bleague-stats-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
