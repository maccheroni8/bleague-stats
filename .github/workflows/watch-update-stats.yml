name: Watch Update Stats

# データ更新（update-stats.yml）が止まっていないかを見張る。更新のワークフローとは別のファイルにしてある:
# 更新側のファイルが無効になると外部（cron-job.org）からの起動も予備の定時実行もまとめて止まるため（DESIGN.md 208章）、
# それとは別のファイルで動く見張りを、二重の備えにする。
# - 更新の30分おきの実行は、試合の無い時間帯も「新着なしで即終了」として成功で終わる。
#   そのため「STALE_HOURS 時間以上、成功した実行が無い」を停止とみなせる
# - 停止とみなしたら Issue を1件立てる。同じラベルの Issue が開いている間は重ねて立てない
# - 成功した実行が戻ったら、開いている Issue にコメントして閉じる
# - 「最新の成功」は、実行の一覧を絞り込み（gh run list --status success）を使わずに直近 RUN_LIMIT 件だけ取り、
#   結論が success のものを手元で選んで決める（絞り込みが古い成功を返し、2026-10-05に誤報のIssueが立ったため。DESIGN.md 208章）。
#   判定に使った実行のIDと時刻は、Issueの本文に書く

on:
  schedule:
    - cron: "23 * * * *" # 毎時23分（更新の実行の07/22/37/52分とずらす）
  workflow_dispatch:
    inputs:
      stale_hours:
        description: "停止とみなす時間（動作確認用。空なら6時間。0にするとIssueを立てる動きを確かめられる）"
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: watch-update-stats
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  UPDATE_WORKFLOW: update-stats.yml
  STALE_HOURS: ${{ github.event.inputs.stale_hours || '6' }}
  ISSUE_LABEL: update-stalled
  RUN_LIMIT: "50" # 直近の実行を何件取るか（30分おき＋予備の定時実行で、6時間分は20件ほど）

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the last successful update run
        run: |
          set -euo pipefail
          case "$STALE_HOURS" in ''|*[!0-9]*) echo "stale_hours は0以上の整数で指定してください: $STALE_HOURS"; exit 1;; esac

          # 直近の実行を絞り込みなしで取り、結論が success のうち最も新しいものを「最新の成功」にする
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$UPDATE_WORKFLOW" \
            --limit "$RUN_LIMIT" --json databaseId,createdAt,conclusion)
          fetched=$(jq 'length' <<<"$runs")
          oldest=$(jq -r 'sort_by(.createdAt) | first | .createdAt // ""' <<<"$runs")
          latest=$(jq -c '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | last // empty' <<<"$runs")
          now=$(date -u +%s)
          if [ -n "$latest" ]; then
            last=$(jq -r '.createdAt' <<<"$latest")
            last_id=$(jq -r '.databaseId' <<<"$latest")
            age_hours=$(( (now - $(jq -r '.createdAt | fromdateiso8601' <<<"$latest")) / 3600 ))
            basis="最新の成功: 実行ID ${last_id}、開始 ${last}（UTC）（直近 ${fetched} 件から選択）"
          else
            last=""
            last_id=""
            age_hours=9999
            basis="取得した直近 ${fetched} 件に成功した実行がありません（取得した中で最も古い実行: ${oldest:-なし}（UTC））"
          fi
          echo "$basis age_hours=$age_hours"

          gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" \
            --description "データ更新が止まっている" --color B60205 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number // ""')

          if [ "$age_hours" -ge "$STALE_HOURS" ]; then
            if [ -n "$open" ]; then
              echo "停止中（Issue #$open は作成済みのため重ねて立てない）"
              exit 0
            fi
            body="データ更新のワークフロー（${UPDATE_WORKFLOW}）で、成功した実行が ${STALE_HOURS} 時間以上ありません。

          - 判定に使った情報: ${basis}
          - 確認時刻: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          確認すること:
          1. [実行の一覧](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${UPDATE_WORKFLOW}) に「workflow file issue」の失敗や、起動そのものが無い時間帯がないか（上の実行IDが一覧の最新の成功と合っているかも見る）
          2. cron-job.org の履歴と通知
          3. 実行が失敗している場合は、失敗した手順のログ

          復旧して成功した実行が出ると、この Issue は自動で閉じます。"
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" \
              --title "データ更新が ${STALE_HOURS} 時間以上成功していません" --body "$body"
          elif [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
              --body "成功した実行が戻りました（実行ID ${last_id}、開始 ${last}）。閉じます。"
            gh issue close "$open" --repo "$GITHUB_REPOSITORY"
          fi
