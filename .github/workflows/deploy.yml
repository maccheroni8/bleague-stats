name: Deploy to GitHub Pages

# 2026-09-23判明: update-stats.yml / update-player-awards.yml のpushは既定のGITHUB_TOKENで
# 行われており、GitHub Actionsの仕様上「GITHUB_TOKENによるpushは他のワークフローのpushイベントを
# 発火させない」（無限ループ防止の組み込み制限）。そのため、これまでbotの日次データ更新コミットは
# 一度も自動デプロイを発火させたことが無かった（人間の手動commitがたまたま後続することで隠れていた）。
# workflow_runトリガーはpushイベントとは独立にGitHub自身が発火するため、この制限を受けない。
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update B.LEAGUE Stats", "Update Player Awards"]
    types: [completed]
  workflow_dispatch:
    inputs:
      simulate_build_failure:
        description: "導出データの作成をわざと失敗させる（失敗時に公開サイトが前の版のまま残ることと、通知が届くことの確認用。DESIGN.md 206章）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # workflow_run元のジョブが残したartifact（deploy-signal）をダウンロードするため

# Pagesへのデプロイは同時に1つだけ。実行中でも新しいpushを待たせず、進行中のものは
# 完了させてから最新のpushで上書きする（deploy-pagesの一般的な運用）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # workflow_run経由のときに実際にデプロイすべきかを判定する。判定材料は2つ:
  # 1. 元のジョブが成功か失敗で終わったか（キャンセル等は対象外）。失敗でも、日程・ボックススコア等の
  #    取得の失敗は continue-on-error で集計・commitまで進め、末尾の「Fail if ...」でジョブを失敗にして
  #    通知しているだけなので、commitがあれば反映する（2026-09-27、DESIGN.md 8-9）。commitより前で
  #    失敗した回は deploy-signal が false（またはartifact無し）になり、下の2でスキップされる
  # 2. 実際にデータ（data/配下）へのcommitがあったか（2026-09-23追加。30分おきの頻繁チェックが
  #    「対象試合なし」で即終了した実行や、他に変更が無かった実行では、workflow_run自体は
  #    successで完了するがデプロイする意味が無いため。update-stats.yml/update-player-awards.yml
  #    が残す deploy-signal artifact（deploy-changed.txt に true/false）を見る）
  # push/workflow_dispatchはこの判定の対象外（常にデプロイする）
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Download deploy signal artifact (workflow_run only)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deploy-signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: deploy-signal

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f deploy-signal/deploy-changed.txt ] && [ "$(cat deploy-signal/deploy-changed.txt)" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::データに変更が無かった実行のため、デプロイをスキップします"
          fi

  # 導出データ（集計結果。scripts/lib/dataLayout.ts の B）はコミットせず、このワークフローが元データから作る（DESIGN.md 206章）。
  # 作る時間を抑えるため、過去のシーズンはシーズンごとの別ジョブで作り、結果を GitHub Actions のキャッシュに保存する。
  # キーは「そのシーズンの元データ」「シーズンをまたいで読む元データ」「集計のコード」の内容から作る（scripts/build-data.ts の key）。
  # どれかが変わったらキーが変わり、そのシーズンだけ作り直す。今のシーズンと、全シーズンをまたぐ集計（歴代ランキングなど）は毎回作る
  plan:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.plan.outputs.current }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # 2026-10-04判明: workflow_run の head_sha は「更新ジョブが開始時に取得したコミット」で、更新ジョブが自分で
      # 作ったデータのコミット（その直後のコミット）を含まない。これを使うと毎回1つ前のデータがデプロイされ、
      # 最後のコミット（試合が終了した更新など）が、次のコミットが来るまで公開されない。
      # github.sha は、push では pushされたコミット、workflow_run と workflow_dispatch では mainの最新のコミットなので、
      # どのイベントでも「その時点のmainの最新」をビルドする（DESIGN.md 198章）
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Plan (current season and cache keys of past seasons)
        id: plan
        run: node --experimental-strip-types scripts/build-data.ts plan

  past-seasons:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      # 保存した導出データ（derived-out/data/{season}/…）。ヒットしたら作成は飛ばす
      - name: Restore derived data of this season
        id: cache
        uses: actions/cache@v4
        with:
          path: derived-out
          key: derived-v1-${{ matrix.season }}-${{ matrix.key }}

      - name: Setup Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      # 作る前に、リポジトリに残っている導出データ（切り替え前はコミットされている）を消して、元データから作ったものだけを保存する
      - name: Build derived data of this season
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          node --experimental-strip-types scripts/build-data.ts clean
          node --experimental-strip-types scripts/build-data.ts --season ${{ matrix.season }} --season-only
          node --experimental-strip-types scripts/build-data.ts export ${{ matrix.season }} derived-out

      - name: Upload derived data of this season
        uses: actions/upload-artifact@v4
        with:
          name: derived-${{ matrix.season }}
          path: derived-out
          retention-days: 1

  build:
    needs: [check, plan, past-seasons]
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 失敗時に公開サイトが前の版のまま残ることと、通知が届くことの確認用（手動実行で指定したときだけ）
      - name: Simulate build failure (manual test only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulate_build_failure == 'true' }}
        run: |
          echo "::error title=Simulated failure::導出データの作成をわざと失敗させています（確認用）"
          exit 1

      # リポジトリに残っている導出データ（切り替え前はコミットされている）に左右されないよう、先にすべて消す
      - name: Remove derived data in the checkout
        run: node --experimental-strip-types scripts/build-data.ts clean

      # 過去のシーズンの導出データ（上のジョブで作った、または保存してあったもの）を data/ に重ねる
      - name: Download derived data of past seasons
        uses: actions/download-artifact@v4
        with:
          pattern: derived-*
          merge-multiple: true
          path: .

      # 今のシーズン（と、導出データがまだ無いシーズン）を作り、続けて全シーズンをまたぐ集計を作る
      - name: Build derived data (current season and cross-season)
        run: node --experimental-strip-types scripts/build-data.ts --season ${{ needs.plan.outputs.current }}

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # main 以外のブランチでの手動実行（導出データの作成の試験など）では公開しない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
