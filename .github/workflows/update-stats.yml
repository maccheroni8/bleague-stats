name: Update B.LEAGUE Stats

# 深夜のディープrecheckの実行には名前に [deep] を付ける（予備の定時実行が、実行済みかを一覧から判定するため）
run-name: Update B.LEAGUE Stats${{ (github.event.schedule == '0 20 * * *' || github.event.inputs.deep_recheck == 'true') && ' [deep]' || '' }}

# DESIGN.md 8章の自動更新フロー（2026-09-23改訂: 日程データに基づく更新タイミングに変更）。
# - 頻繁チェック（30分おき。毎時07分・37分、毎時00分は避けて負荷を分散）:
#   schedule.json（前回までにコミット済みのデータ）だけを見て、「ティップオフ+2時間を過ぎて
#   いてまだボックススコアを取得していない試合」があるときだけ本処理（直近14日分の日程軽量
#   チェック＋新着試合のボックススコア取得＋commit&push）に進む。無ければ
#   bleague.jpへ一切アクセスせず即終了する（check-pending-games.ts）
# - 深夜のディープrecheck（毎日JST3:10にcron-job.orgからworkflow_dispatch（deep_recheck=true）で起動。GitHub側の
#   定時実行は毎日JST5時（UTC20時）の予備で、直近20時間以内に深夜実行が成功していれば頻繁チェックとして扱う。DESIGN.md 8-10章）:
#   上記の判定を経ずに毎回本処理を実行する。直近21日
#   以内のwatching試合の再チェック（8-1章のスタッツ修正対応）・今後14日の日程変更検知（8-7章）・
#   名簿取得・新競技規則検知の検知ステップはこちらだけで行う
# - workflow_dispatch: 手動実行用。full_schedule=true でシーズン全体のスケジュールをフル収集する
#   （8-2章: シーズン開幕時・日程変更が疑われるときに使う。フル収集は自動実行には含めない）。
#   既定（deep_recheck=false）では頻繁チェックと同じくcheck-pending-games.tsの判定を経る
#   （動作確認用）。deep_recheck=trueを指定すると深夜のディープrecheckと同じ扱いになる

on:
  schedule:
    - cron: "7,37 * * * *" # 30分おき（毎時07分・37分）: 頻繁チェック
    - cron: "0 20 * * *" # 毎日JST5時（UTC20時）: 深夜のディープrecheckの予備（外部のcron-job.orgが主。実行済みならスキップ）
  workflow_dispatch:
    inputs:
      season:
        description: "対象シーズン（例: 2025-26）。空なら現在日付から自動判定"
        required: false
        default: ""
      full_schedule:
        description: "シーズン全体のスケジュールをフル収集する（初回・日程変更時のみ推奨）"
        required: false
        default: false
        type: boolean
      deep_recheck:
        description: "深夜のディープrecheck（21日間の再チェック・名簿取得・新競技規則検知）として実行する"
        required: false
        default: false
        type: boolean

# 二重実行によるコミット競合・並列スクレイピングを防ぐ（DESIGN.md 2章: 並列アクセスしない）。
# 頻繁チェックと深夜のディープrecheckは同じワークフロー内の別cronのため、自動的に同じ
# グループで直列化される
concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write
  actions: read # 予備の定時実行が、直近の深夜実行（実行一覧）を確認するため

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 同じ実行の中で取り直した試合の記録（コミットしない一時ファイル。見張りの一覧が同じ試合を重ねて取りに行かないための判定。DESIGN.md 205章）。
      # ジョブ直下の env では runner コンテキストが使えず、ワークフロー全体が無効になる（2026-10-05判明）ため、ステップで環境変数に書く
      - name: Prepare temporary file paths
        run: echo "FETCHED_GAMES_FILE=$RUNNER_TEMP/fetched-games.txt" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine season
        id: season
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            SEASON="${{ github.event.inputs.season }}"
          else
            SEASON=$(node --experimental-strip-types scripts/print-current-season.ts)
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "対象シーズン: $SEASON"

      # 深夜cron（0 20 * * *。予備）、またはworkflow_dispatchでdeep_recheck=trueのときだけ
      # 「常に本処理を行う」深夜モードにする。それ以外（頻繁チェック・既定のworkflow_dispatch）は
      # 後続のcheck-pending-gamesステップの判定を挟む（手動実行でも早期終了経路を確認できるように）
      - name: Determine run mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NIGHTLY="false"
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            NIGHTLY="true"
            # 予備の定時実行: 直近20時間以内に深夜実行（名前に [deep]）が成功していれば、深夜の本処理は行わず頻繁チェックとして扱う。
            # 外部（cron-job.org）が失敗した日、または実行一覧を読めなかったときは、そのまま深夜の本処理を行う
            SINCE=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            DONE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-stats.yml --status success --limit 100 --json displayTitle,createdAt \
              | jq --arg since "$SINCE" '[.[] | select((.displayTitle | contains("[deep]")) and .createdAt >= $since)] | length' || echo 0)
            if [ "${DONE:-0}" -gt 0 ]; then
              NIGHTLY="false"
              echo "::notice::直近20時間以内に深夜実行が成功しているため、予備の深夜実行はスキップします（頻繁チェックとして扱います）"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deep_recheck }}" = "true" ]; then
            NIGHTLY="true"
          fi
          echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
          echo "深夜ディープrecheck: $NIGHTLY"

      # 頻繁チェックのみ: bleague.jpへアクセスする前に、ローカルのschedule.jsonだけで
      # 「本処理が必要な試合があるか」を判定する（DESIGN.md 8章）
      - name: Check for games needing processing
        id: check
        if: steps.mode.outputs.nightly != 'true'
        run: node --experimental-strip-types scripts/check-pending-games.ts --season ${{ steps.season.outputs.season }}

      - name: Determine whether to proceed
        id: proceed
        run: |
          if [ "${{ steps.mode.outputs.nightly }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=${{ steps.check.outputs.should_run }}" >> "$GITHUB_OUTPUT"
          fi

      # 日程の取得が失敗しても（bleague.jp の一時的なエラー等）、手元の日程データ（前回の schedule.json）のまま
      # ボックススコアの取得・集計・コミット・デプロイを続ける（デプロイはジョブが失敗で終わっても、コミットがあれば deploy.yml が行う）。末尾の「Fail if schedule scrape failed」でジョブを失敗にして通知する
      # （選手名簿と同じ形。DESIGN.md 8-9）。問い合わせごとの5xx・通信の失敗は scripts/lib/throttle.ts で1回だけ再試行済み
      - name: Scrape schedule (full)
        id: schedule_full
        if: ${{ steps.proceed.outputs.run == 'true' && github.event.inputs.full_schedule == 'true' }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/scrape-schedule.ts --season ${{ steps.season.outputs.season }}

      # 30分おきの実行は当日と前日の2日分だけ問い合わせる（2026-09-26から。それまでは毎回直近14日分＝28回。DESIGN.md 8-2・8-9）。
      # 深夜のディープrecheckだけ、直近14日分と今後14日分の日程を問い合わせて、新しく載った試合と開催予定の日付・時刻の変更を
      # 検知する（--verify-upcoming。DESIGN.md 8-7章）。ボックススコア取得は開催日を過ぎた試合しか
      # 問い合わせないため、日程変更はここで拾う。どちらも、直近の日付のページに載っているのに試合日が違う試合（延期で前倒し）は
      # その場で開催予定を取り直す（DESIGN.md 8-9）
      - name: Scrape schedule (recent days)
        id: schedule_recent
        if: ${{ steps.proceed.outputs.run == 'true' && github.event.inputs.full_schedule != 'true' }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/scrape-schedule.ts --season ${{ steps.season.outputs.season }} --recent ${{ steps.mode.outputs.nightly == 'true' && '14 --verify-upcoming 14' || '2' }}

      # 頻繁チェック（30分おき）は新着試合のボックススコア取得のみ行う。既存のwatching試合の
      # 再チェックは深夜のディープrecheckに限定する（DESIGN.md 8-1章）
      # ボックススコアは、ある試合で失敗してもほかの試合の取得を続け、最後に失敗した試合を一覧にして終了コード1で終わる。
      # 取れた試合の集計・コミットは続けたいので continue-on-error にし、末尾の「Fail if boxscore scrape failed」で通知する（DESIGN.md 8-9）
      - name: Scrape boxscores (new games only)
        id: boxscore_new
        if: ${{ steps.proceed.outputs.run == 'true' && steps.mode.outputs.nightly != 'true' }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/scrape-boxscore.ts --season ${{ steps.season.outputs.season }} --new-only

      - name: Scrape boxscores (new games + watching re-checks)
        id: boxscore_nightly
        if: ${{ steps.proceed.outputs.run == 'true' && steps.mode.outputs.nightly == 'true' }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/scrape-boxscore.ts --season ${{ steps.season.outputs.season }}

      # 見張りの一覧（data/game-watchlist.json。DESIGN.md 202章）: こちらが見つけた公式の記録の誤りが、公式のスタッツ修正で直るかを見張る。
      # 一覧の試合を（21日を過ぎていても）取り直し、交代・得点の記録、recordFixedFlg、最終スコア、公式の+/-が前回から変わっていれば、
      # 一覧の履歴に残し、ジョブの通知とコミットメッセージに1行ずつ出す。変化が無ければ何も書かない。深夜のディープrecheckでのみ実行する
      - name: Check game watchlist
        id: watchlist
        if: ${{ steps.proceed.outputs.run == 'true' && steps.mode.outputs.nightly == 'true' }}
        continue-on-error: true
        env:
          WATCH_SUMMARY_FILE: ${{ runner.temp }}/watch-summary.txt
        run: node --experimental-strip-types scripts/game-watchlist.ts check

      # スポーツナビ（Yahoo!スポーツ）のplay-by-play（シュートタイプ別内訳・ターンオーバー種類別）。
      # 頻繁チェック・深夜とも、ボックススコアが保存済みで試合終了済みなのにPBPが未取得の試合だけを
      # 取りに行く（1試合1リクエスト）。深夜は直近21日の試合のうち保存済みPBPが現在のボックススコアと
      # 合わないものも取り直す。スポーツナビ側の失敗でデータ更新全体を止めないようcontinue-on-error
      # （DESIGN.md 129章）
      - name: Scrape Yahoo PBP (Sportsnavi)
        if: steps.proceed.outputs.run == 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: node --experimental-strip-types scripts/scrape-yahoo-pbp.ts --season ${{ steps.season.outputs.season }} --incremental ${{ steps.mode.outputs.nightly == 'true' && '--recheck-recent' || '' }}

      # 名簿取得はbleague.jp側の一時的なエラーや、新規選手が多い日の処理時間超過で
      # 失敗しうるが、それによって試合結果の集計・commitまで止めないよう
      # 失敗/タイムアウトしても後続ステップは必ず実行する。深夜のディープrecheckでのみ実行する
      # 選手マスタは写真取得より先に保存される（scrape-roster.ts）。写真は時間予算（15分）を超えた分を
      # 次回に回すため通常は時間内に終わるが、それでも失敗・時間切れした場合は後続の集計・コミットを
      # 止めないようcontinue-on-errorにしたうえで、末尾の「Fail if roster scan failed」でジョブを失敗にする
      # （continue-on-errorのステップは一覧上「success」に見えてしまい、時間切れに気付けなかったため。DESIGN.md 125章）
      - name: Scrape roster (players master, incremental)
        id: roster
        if: ${{ steps.proceed.outputs.run == 'true' && steps.mode.outputs.nightly == 'true' }}
        timeout-minutes: 25
        continue-on-error: true
        run: node --experimental-strip-types scripts/scrape-roster.ts --season ${{ steps.season.outputs.season }}

      # 進行中のシーズンの身長・体重・ポジションを、1月15日時点の選手名簿の値で固定する（1月15日より前は何もしない。
      # 1月15日より後に初めて出場した選手は、出場後の最初の夜間実行で固定。固定済みは上書きしない。DESIGN.md 148章）。
      # 直前の Scrape roster が保存した選手マスタ・今の選手名簿を読むので、その後に置く。深夜のディープrecheckでのみ実行する
      #
      # 固定の処理は、そのシーズンに出場した選手を選手の試合ログ（導出データ）から調べる。導出データはコミットしない（デプロイのときに
      # 作る。DESIGN.md 206章）ので、固定の直前にこのシーズンの分を作る（コミットされない）。作れなかった夜は固定をせず、次の夜間実行でやり直す
      - name: Build derived data of the current season (for the freeze; not committed)
        id: build_current
        if: ${{ steps.proceed.outputs.run == 'true' && steps.mode.outputs.nightly == 'true' }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/build-data.ts --season ${{ steps.season.outputs.season }} --season-only

      - name: Freeze season profiles (Jan 15)
        id: freeze_profiles
        if: ${{ steps.proceed.outputs.run == 'true' && steps.mode.outputs.nightly == 'true' && steps.build_current.outcome == 'success' }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/freeze-season-profiles.ts

      # 新競技規則(DESIGN.md 16章)の検知。公式データが新表記（ディスラプティブ/フレグラント、
      # カテゴリ1/2）やActionCD1の変更に移行したことにコミット前後で気づくための警報。
      # 異常時はここで失敗させず（データ更新のcommit&pushを止めないため）、最終ステップで
      # ジョブを失敗ステータスにして通知する。深夜のディープrecheckでのみ実行する
      - name: Check rule-change signals
        id: rule_change_check
        if: ${{ steps.proceed.outputs.run == 'true' && steps.mode.outputs.nightly == 'true' }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/check-rule-change.ts --season ${{ steps.season.outputs.season }}

      # ジョブが長時間(最大90分)かかるため、実行中に他のコミットがmainにpushされていることがある。
      # そのままpushすると非fast-forwardで弾かれるので、rebaseしてから再試行する
      - name: Commit and push if changed
        id: commit
        if: steps.proceed.outputs.run == 'true'
        env:
          WATCH_SUMMARY_FILE: ${{ runner.temp }}/watch-summary.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # コミットするのは元データ（A）だけ。導出データ（B）は .gitignore で除いてある。仕分けに無い新しい種類のファイルがあれば、ここで止める
          node --experimental-strip-types scripts/build-data.ts check-layout
          git add data/
          node --experimental-strip-types scripts/build-data.ts check-staged
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            MESSAGE="chore: update ${{ steps.season.outputs.season }} stats ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # 見張りの一覧の試合に変化があった日は、その内容を1行ずつ本文に付ける
            if [ -s "$WATCH_SUMMARY_FILE" ]; then
              MESSAGE="$MESSAGE"$'\n\n'"$(cat "$WATCH_SUMMARY_FILE")"
            fi
            git commit -m "$MESSAGE"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # deploy.yml（workflow_runトリガー）が「データに変更があった実行か」を判定するための
      # シグナルをartifactとして残す（頻繁チェックの即終了ケースを含め、commitステップが
      # 走らなかった場合はfalse扱いにする）。workflow_run経由ではjob outputを直接参照できない
      # ため、artifact経由で受け渡す
      - name: Save deploy signal
        if: always()
        run: |
          mkdir -p /tmp/deploy-signal
          CHANGED="${{ steps.commit.outputs.changed }}"
          if [ -z "$CHANGED" ]; then CHANGED="false"; fi
          echo "$CHANGED" > /tmp/deploy-signal/deploy-changed.txt
          echo "deploy-changed: $CHANGED"

      - name: Upload deploy signal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-signal
          path: /tmp/deploy-signal/deploy-changed.txt
          retention-days: 1

      # 日程・ボックススコアの取得の失敗をジョブの失敗として通知する（取れた分の集計・commit&pushは上のステップで完了済み。DESIGN.md 8-9）
      - name: Fail if schedule scrape failed
        if: ${{ always() && (steps.schedule_full.outcome == 'failure' || steps.schedule_recent.outcome == 'failure') }}
        run: |
          echo "::error title=Schedule scrape failed::日程の取得が失敗しました。手元の日程データのままボックススコアの取得・集計・コミットは続けています。ログで失敗した問い合わせを確認してください"
          exit 1

      - name: Fail if boxscore scrape failed
        if: ${{ always() && (steps.boxscore_new.outcome == 'failure' || steps.boxscore_nightly.outcome == 'failure') }}
        run: |
          echo "::error title=Boxscore scrape failed::一部の試合のボックススコアの取得に失敗しました（ほかの試合は取得・集計・コミット済み。失敗した試合は次回の実行で取り直します）。ログの「取得に失敗した試合」を確認してください"
          exit 1

      # 見張りの一覧の確認の失敗（試合の取得の失敗など）をジョブの失敗として通知する（取れた分の記録・commit&pushは上のステップで完了済み。DESIGN.md 202章）
      - name: Fail if game watchlist check failed
        if: ${{ always() && steps.watchlist.outcome == 'failure' }}
        run: |
          echo "::error title=Game watchlist check failed::見張りの一覧の確認が失敗しました。ログの「取得に失敗」を確認してください（失敗した試合は次回の実行で取り直します）"
          exit 1

      # ロースター取得の失敗・時間切れをジョブの失敗として通知する（データのcommit&pushは上のステップで完了済み）
      - name: Fail if season profile freeze failed
        if: ${{ always() && steps.freeze_profiles.outcome == 'failure' }}
        run: |
          echo "::error title=Season profile freeze failed::Freeze season profiles ステップが失敗しました。身長・体重・ポジションの固定は次の夜間実行でやり直します"
          exit 1

      - name: Fail if roster scan failed
        if: ${{ always() && steps.roster.outcome == 'failure' }}
        run: |
          echo "::error title=Roster scan failed::Scrape roster ステップが失敗または時間切れになりました。選手マスタは写真取得前に保存されますが、ログで保存完了の行が出ているか確認してください"
          exit 1

      # 固定の前に行う導出データの作成の失敗をジョブの失敗として通知する（データのcommit&pushは上のステップで完了済み。デプロイでも同じ作成を行うので、そちらも失敗している可能性が高い）
      - name: Fail if build of derived data failed
        if: ${{ always() && steps.build_current.outcome == 'failure' }}
        run: |
          echo "::error title=Build of derived data failed::導出データ（集計結果）の作成が失敗しました。元データはコミット済みです。身長・体重・ポジションの固定は次の夜間実行でやり直します。ログを確認してください"
          exit 1

      # 検知結果（詳細はCheck rule-change signalsステップのログ・ジョブのSummary）をジョブの失敗として通知する。
      # データ更新のcommit&pushは上のステップで完了済み
      - name: Fail if rule-change signals detected
        # always(): 直前のロースター失敗ステップでジョブが失敗扱いになっても、こちらの通知は出す
        if: ${{ always() && steps.rule_change_check.outcome == 'failure' }}
        run: |
          echo "::error::新競技規則に関する異常を検知しました（DESIGN.md 16章）。Check rule-change signalsステップのログを確認してください"
          exit 1
