name: Verify rule-change failure status (temporary)

# update-stats.yml の「検知ステップ→失敗ステップ」の配線が、異常時に実際にジョブを失敗させるかを
# 確かめるための使い捨てworkflow（DESIGN.md 16-4章）。確認後に削除する。
# runner上にだけ偽の試合データ（data/9999-99）を作るので、リポジトリのデータには触れず、
# commit/pushもしない。force_anomaly=true→失敗になるはず、false→成功になるはず。

on:
  workflow_dispatch:
    inputs:
      force_anomaly:
        description: "true: 未知のActionCD1を含む偽データで異常を強制 / false: 正常な偽データ（対照）"
        required: true
        default: "true"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Create fake season data on the runner
        run: |
          node -e '
            const { gzipSync } = require("node:zlib");
            const { mkdirSync, writeFileSync } = require("node:fs");
            const force = "${{ github.event.inputs.force_anomaly }}" === "true";
            const now = new Date().toISOString();
            const game = {
              scheduleKey: "1",
              season: "9999-99",
              date: "2099-01-01",
              meta: { firstScrapedAt: now, lastCheckedAt: now, lastChangedAt: now, status: "final", revisionCount: 0, latestRevisionId: 0 },
              gameEndedFlg: true,
              raw: { PlayByPlays: [
                { ActionCD1: 1, PlayText: "#1 テスト 3Pシュート成功" },
                { ActionCD1: force ? 99 : 2, PlayText: "#1 テスト 3Pシュート失敗" },
              ] },
            };
            mkdirSync("data/9999-99/games", { recursive: true });
            writeFileSync("data/9999-99/games/1.json.gz", gzipSync(Buffer.from(JSON.stringify(game))));
            console.log("force_anomaly=" + force);
          '

      # ↓ ここから下は update-stats.yml と同じ構造（コピー）。--seasonだけ偽シーズンにしている
      - name: Check rule-change signals
        id: rule_change_check
        continue-on-error: true
        run: node --experimental-strip-types scripts/check-rule-change.ts --season 9999-99 --all

      - name: Fail if rule-change signals detected
        if: ${{ steps.rule_change_check.outcome == 'failure' }}
        run: |
          echo "::error::新競技規則に関する異常を検知しました（DESIGN.md 16章）。Check rule-change signalsステップのログを確認してください"
          exit 1
